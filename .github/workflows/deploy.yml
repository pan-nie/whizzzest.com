name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 串行化部署：同一 ref（main 的 push/dispatch）排队执行，避免交叉部署。
# 按 ref 分组 —— PR 检查之间互不排队；cancel-in-progress: false 只排队不取消，不阻断正常部署。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 构建与安全回归检查通过后才允许部署（不需要生产 token/secret）。
  check:
    name: Build + deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: node build.js

      - name: Security regression tests
        run: npm run test:security

      - name: Dry-run main site
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Dry-run admin portal
        working-directory: admin
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Dry-run merchant portal
        working-directory: merchant
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Dry-run writer portal
        working-directory: writer
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Dry-run im portal
        working-directory: im
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Dry-run game portal
        working-directory: game
        run: npx -y wrangler@4.129.0 deploy --dry-run --outdir=.wrangler-dry

      - name: Worker transport integration tests
        run: npm run test:workers

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: node build.js

      - name: Check API token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"

      # 管理后台（admin.whizzzest.com，admin/ 目录独立 worker）
      - name: Deploy admin
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: admin

      # 商户门户（merchant.whizzzest.com，merchant/ 目录独立 worker）
      - name: Deploy merchant portal
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: merchant

      # 文库作者门户（writer.whizzzest.com，writer/ 目录独立 worker，docs/文库方案.md）
      - name: Deploy writer portal
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: writer

      # IM 即时聊天门户（im.whizzzest.com，im/ 目录独立 worker，docs/IM聊天方案.md）
      - name: Deploy im portal
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: im

  # 企业仓库镜像（docs/仓库同步方案.md）：needs=deploy → **部署成功后才推**，企业仓库上看到的就是
  # 已上线的那版，不会再出现「拿到企业仓库代码却比线上新」的错觉。
  # 守卫①：只在权威仓库 pan-nie/whizzzest.com 执行——同一份文件镜像到企业仓库后也会跑，靠本行跳过，
  #   防回环（企业仓库 Actions 亦已关闭，见方案 §5）。
  # 守卫②：`vars.ORG_MIRROR_ENABLED == 'true'` 总闸 —— 2026-10-14 验证通过后已置 true；
  #   置 false（或删除该 variable）即停用镜像（job 显示 skipped 而非红），可作 kill switch。
  # 凭据（业主拍板方案 A，2026-10-14 已验证）：fine-grained PAT，Resource owner=Whizzzest、
  #   仅授权 Whizzzest/whizzzest.com、`Contents: Read and write` + **`Workflows: Read and write`**
  #   （Workflows 这一项是必需的——同日实测：Deploy Key 被 GitHub 拒绝推送 `.github/workflows/**`，
  #   报错 "refusing to allow an OAuth App to create or update workflow … without `workflow` scope"，
  #   见方案 §8）→ token 存 pan-nie 侧 secret `ORG_MIRROR_TOKEN`，走 HTTPS 推送。
  #   只推 HEAD:main，**不用 `--mirror`**（避免误删企业仓库上的分支/标签）。
  mirror:
    name: Mirror to Whizzzest/whizzzest.com
    needs: deploy
    if: github.repository == 'pan-nie/whizzzest.com' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ORG_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 浅克隆推不动（shallow update not allowed），镜像必须是完整历史

      - name: Push main to the org mirror
        env:
          ORG_MIRROR_TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_MIRROR_TOKEN}" ]; then
            echo "::error::ORG_MIRROR_TOKEN 未配置，镜像未执行（见 docs/仓库同步方案.md §8）"
            exit 1
          fi
          # checkout 会把 GITHUB_TOKEN 写进 http.https://github.com/.extraheader；它对本仓库有效，
          # 但对企业仓库没有写权限、且缺 workflow scope —— 必须先摘掉，否则推送会被它认证后拒绝。
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote add org "https://x-access-token:${ORG_MIRROR_TOKEN}@github.com/Whizzzest/whizzzest.com.git"
          git push org HEAD:refs/heads/main

# 注：部署后冒烟检查已移除（2026-09-08）——站点边缘机器人防护会质询数据中心 IP
# 的非浏览器请求（403 + cf-mitigated: challenge），CI 无法穿透。
# scripts/smoke.sh 保留为本地手动检查工具：SMOKE_FINGERPRINT=false bash scripts/smoke.sh
