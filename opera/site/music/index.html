<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1112">
  <meta name="description" content="在梨园剧场试听原创音乐与锣鼓。">

  <script type="module" src="/assets/music.mjs"></script>

<body>
  <header class="site-header"><div class="shell header-row">
    <a class="wordmark" href="/"><span class="seal" aria-hidden="true">戏</span><span>梨园剧场</span></a>
